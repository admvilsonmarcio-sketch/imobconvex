[project]
name = "imobconvex-backend"
version = "0.2.0"
description = "Backend FastAPI para o sistema imobiliário inteligente ImobConvex"
requires-python = ">=3.11"
readme = "README.md"
keywords = ["fastapi", "imobiliaria", "crm", "ia"]

[project.dependencies]
fastapi = "0.110.0"
uvicorn = { version = "0.27.1", extras = ["standard"] }
sqlmodel = "0.0.16"
sqlalchemy = "2.0.25"
psycopg = { version = "3.1.18", extras = ["binary"] }
pydantic = "2.6.1"
pydantic-settings = "2.1.0"
python-dotenv = "1.0.1"
passlib = { version = "1.7.4", extras = ["bcrypt"] }
python-jose = { version = "3.3.0", extras = ["cryptography"] }
email-validator = "2.1.1"
python-multipart = "0.0.9"

[project.optional-dependencies]
dev = [
  "ruff==0.3.0",
  "pytest==8.0.2",
  "pytest-asyncio==0.23.5",
  "httpx==0.27.0",
  "faker==22.5.1"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app"]
